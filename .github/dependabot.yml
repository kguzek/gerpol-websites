version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 15
    commit-message:
      prefix: chore
      include: scope

    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

    groups:
      react:
        patterns:
          - "react"
          - "react-dom"

      next:
        patterns:
          - "next"
          - "@next/*"
          - "eslint-config-next"

      aws-sdk:
        patterns:
          - "@aws-sdk/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 15
    commit-message:
      prefix: chore
      include: scope
